name: release

# Tagging is the whole release process: build a universal .app, publish the zip,
# and point the tap's formula at it.
#
#   make dist VERSION=0.2.0   # optional local check
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - run: swift --version

      - name: Build the release zip
        id: dist
        run: |
          make dist VERSION="${{ steps.version.outputs.version }}"
          zip=".build/dist/LLMUsage-${{ steps.version.outputs.version }}.zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # An arm64 binary without a signature will not execute, and ditto is what
      # carries the ad-hoc one through the zip. Fail here rather than shipping a
      # bundle nobody can open.
      - name: Verify the unpacked bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          work=$(mktemp -d)
          ditto -x -k "${{ steps.dist.outputs.zip }}" "$work"
          # The zip wraps the bundle in LLMUsage-<version>/ so Homebrew has a
          # single top-level directory to descend into — verify through that
          # prefix, not at the root (see the Makefile's STAGE).
          app="$work/LLMUsage-$VERSION/LLMUsage.app"
          codesign --verify --strict "$app"
          lipo -archs "$app/Contents/MacOS/LLMUsage" | grep -q x86_64
          lipo -archs "$app/Contents/MacOS/LLMUsage" | grep -q arm64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            "${{ steps.dist.outputs.zip }}" \
          || gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.dist.outputs.zip }}" --clobber

      # The tap is this repository, so `brew install` reads the formula from the
      # default branch — not from the tag.
      - name: Point the formula at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.dist.outputs.sha256 }}
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          sed -i '' \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  url \".*\"|  url \"https://github.com/${{ github.repository }}/releases/download/$TAG/LLMUsage-$VERSION.zip\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            Formula/llm-usage.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build: point the formula at $TAG"
          git push origin "HEAD:$branch"
